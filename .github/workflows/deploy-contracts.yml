name: Deploy Contracts

on:
  push:
    branches: [main]
    paths: ['apps/contracts/**']
  workflow_dispatch:
    inputs:
      network:
        description: Target network
        required: true
        default: testnet
        type: choice
        options: [testnet, mainnet]

jobs:
  # Push-triggered deploys are testnet-only; mainnet requires workflow_dispatch.
  guard-mainnet:
    name: Block mainnet on push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.event.inputs.network == 'mainnet'
    steps:
      - name: Reject mainnet on push
        run: |
          echo "::error::Direct push to main cannot trigger a mainnet deploy. Use workflow_dispatch and obtain approver sign-off."
          exit 1

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    # The 'mainnet' GitHub Environment requires manual approval from a reviewer
    # before this job runs (configure required reviewers in Settings → Environments).
    environment: ${{ github.event.inputs.network || 'testnet' }}
    needs: []
    # Skip this job entirely if the guard above would have fired
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.event.inputs.network != 'mainnet')
    steps:
      - uses: actions/checkout@v4

      - name: Confirm mainnet deployment
        if: github.event.inputs.network == 'mainnet'
        run: |
          echo "::warning::Deploying to MAINNET. This job was approved by a required reviewer via the 'mainnet' GitHub Environment."
          echo "Deployer: ${{ github.actor }}"
          echo "Triggered at: ${{ github.event.head_commit.timestamp || github.event.created_at }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/contracts
          cache-on-failure: true
      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --features opt
      - name: Build
        run: stellar contract build
        working-directory: apps/contracts
      - name: Deploy energy_token
        id: deploy-energy
        run: |
          echo "contract_id=$(stellar contract deploy \
            --wasm target/wasm32-unknown-unknown/release/energy_token.wasm \
            --source ${{ secrets.DEPLOYER_SECRET_KEY }} \
            --network ${{ github.event.inputs.network || 'testnet' }})" >> $GITHUB_OUTPUT
        working-directory: apps/contracts
      - name: Deploy audit_registry
        id: deploy-registry
        run: |
          echo "contract_id=$(stellar contract deploy \
            --wasm target/wasm32-unknown-unknown/release/audit_registry.wasm \
            --source ${{ secrets.DEPLOYER_SECRET_KEY }} \
            --network ${{ github.event.inputs.network || 'testnet' }})" >> $GITHUB_OUTPUT
        working-directory: apps/contracts
      - name: Deploy community_governance
        id: deploy-governance
        run: |
          echo "contract_id=$(stellar contract deploy \
            --wasm target/wasm32-unknown-unknown/release/community_governance.wasm \
            --source ${{ secrets.DEPLOYER_SECRET_KEY }} \
            --network ${{ github.event.inputs.network || 'testnet' }})" >> $GITHUB_OUTPUT
        working-directory: apps/contracts
      - name: Setup Node for smoke test
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install JavaScript dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Run post-deployment smoke test
        run: pnpm exec node scripts/smoke-test.mjs
        env:
          SMOKE_NETWORK: ${{ github.event.inputs.network || 'testnet' }}
          ENERGY_TOKEN_ID: ${{ steps.deploy-energy.outputs.contract_id }}
          AUDIT_REGISTRY_ID: ${{ steps.deploy-registry.outputs.contract_id }}
          SMOKE_TOKEN_MINTER_SECRET_KEY: ${{ secrets.SMOKE_TOKEN_MINTER_SECRET_KEY }}
          SMOKE_METER_SECRET_KEY: ${{ secrets.SMOKE_METER_SECRET_KEY }}
